<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Ali Hasem</title>
  <meta name="description" content="Portfolio of Ali Hasem, software developer studying at HTL Leonding. Java, C#, TypeScript and Node.js. Available for opportunities." />
  <meta name="author" content="Ali Hasem" />
  <meta property="og:title" content="Ali Hasem — Software Developer" />
  <meta property="og:description" content="Software developer studying at HTL Leonding. Java, C#, TypeScript." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ahasemhtl.github.io/" />
  <meta name="theme-color" content="#0b0b12" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body class="subpage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <header class="nav">
    <a href="index.html" class="logo" aria-label="Ali Hasem, home">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        <path class="hex" d="M20 2 36 11v18L20 38 4 29V11z"/>
        <path class="ah" d="M10 28l5-15 5 15M12 23h6M25 13v15M32 13v15M25 20.5h7"/>
      </svg>
      <span class="logo-word mono">ali<b>.</b>hasem</span>
    </a>
    <nav aria-label="Sections">
      <a href="index.html#projects" data-i18n="nav_projects">Projects</a>
      <a href="index.html#skills" data-i18n="nav_skills">Skills</a>
      <a href="index.html#journey" data-i18n="nav_journey">Journey</a>
      <a href="index.html#contact" data-i18n="nav_contact">Contact</a>
    </nav>
    <div class="nav-tools">
      <button class="kbd-btn" id="openPalette" aria-label="Open command menu"><span class="kbd">Ctrl</span><span class="kbd">K</span></button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="de">DE</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="page-head">
      <div class="wrap">
        <a class="back-link mono reveal" href="index.html"><span aria-hidden="true">←</span> <span data-i18n="back">Back to home</span></a>
        <span class="num mono reveal" data-i18n="page_kicker">Archive</span>
        <h1 class="page-title reveal" style="--d:.08s" data-i18n="page_title">All projects</h1>
        <p class="page-sub reveal" style="--d:.16s" data-i18n="page_sub">Everything I built so far.</p>
        <div class="filters reveal" style="--d:.24s" role="group" aria-label="Filter">
          <button class="active" data-filter="all" data-i18n="f_all">All</button>
          <button data-filter="web" data-i18n="f_web">Web</button>
          <button data-filter="desktop" data-i18n="f_desktop">Desktop</button>
          <button data-filter="team" data-i18n="f_team">Team</button>
          <button data-filter="solo" data-i18n="f_solo">Solo</button>
        </div>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="cards" id="cards"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© <span id="year"></span> Ali Hasem</span>
      <span class="mono" data-i18n="footer_hint">Tip: press Ctrl + K</span>
    </div>
  </footer>

  <!-- Project modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
    <div class="modal-box">
      <button class="modal-close" id="mClose" aria-label="Close">×</button>
      <p class="mono m-meta" id="mMeta"></p>
      <h3 id="mTitle"></h3>
      <p id="mDesc"></p>
      <ul id="mPoints"></ul>
      <div class="chips" id="mTech"></div>
      <div class="m-links" id="mLinks"></div>
    </div>
  </div>

  <!-- Command palette -->
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command menu" hidden>
    <div class="palette-box">
      <input id="pInput" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command…" />
      <ul id="pList" role="listbox"></ul>
      <div class="palette-foot mono"><span>↑↓</span> <span>Enter</span> <span>Esc</span></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
