<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Technology toolkit: programming, web, and practice">
  <defs>
    <linearGradient id="back" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#111a31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="48%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#back)" stroke="#334155"/>
  <rect x="34" y="34" width="8" height="34" rx="4" fill="url(#line)" filter="url(#soft)">
    <animate attributeName="height" values="20;34;20" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="58" y="51" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="2">TECHNOLOGY TOOLKIT</text>
  <text x="58" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">The languages and practices behind my school projects</text>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(34 110)">
      <rect width="352" height="180" rx="18" fill="#111c35" stroke="#26466e"/>
      <rect width="352" height="5" rx="2.5" fill="#60a5fa"/>
      <text x="24" y="42" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="2">01 · PROGRAMMING</text>
      <text x="24" y="71" fill="#e2e8f0" font-size="18" font-weight="700">Languages I use</text>
      <g font-size="15" font-weight="600">
        <rect x="24" y="98" width="76" height="40" rx="12" fill="#17365f"/><text x="43" y="124" fill="#dbeafe">Java</text>
        <rect x="112" y="98" width="58" height="40" rx="12" fill="#2c2458"/><text x="130" y="124" fill="#ede9fe">C#</text>
        <rect x="182" y="98" width="124" height="40" rx="12" fill="#3b3213"/><text x="201" y="124" fill="#fef3c7">TypeScript</text>
      </g>
    </g>

    <g transform="translate(424 110)">
      <rect width="352" height="180" rx="18" fill="#111c35" stroke="#2d5b63"/>
      <rect width="352" height="5" rx="2.5" fill="#2dd4bf"/>
      <text x="24" y="42" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="2">02 · WEB</text>
      <text x="24" y="71" fill="#e2e8f0" font-size="18" font-weight="700">Interfaces &amp; styling</text>
      <g font-size="15" font-weight="600">
        <rect x="24" y="98" width="74" height="40" rx="12" fill="#5b2c25"/><text x="43" y="124" fill="#fed7aa">HTML</text>
        <rect x="110" y="98" width="68" height="40" rx="12" fill="#173e78"/><text x="132" y="124" fill="#bfdbfe">CSS</text>
      </g>
    </g>

    <g transform="translate(814 110)">
      <rect width="352" height="180" rx="18" fill="#111c35" stroke="#59477a"/>
      <rect width="352" height="5" rx="2.5" fill="#a78bfa"/>
      <text x="24" y="42" fill="#ddd6fe" font-size="13" font-weight="700" letter-spacing="2">03 · PRACTICE</text>
      <text x="24" y="71" fill="#e2e8f0" font-size="18" font-weight="700">How I build</text>
      <g font-size="14" font-weight="600">
        <rect x="24" y="98" width="82" height="40" rx="12" fill="#2f2454"/><text x="48" y="124" fill="#ede9fe">OOP</text>
        <rect x="118" y="98" width="100" height="40" rx="12" fill="#2f2454"/><text x="137" y="124" fill="#ede9fe">Patterns</text>
        <rect x="230" y="98" width="94" height="40" rx="12" fill="#2f2454"/><text x="247" y="124" fill="#ede9fe">Teamwork</text>
      </g>
    </g>
  </g>
</svg>