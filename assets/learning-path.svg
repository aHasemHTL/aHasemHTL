<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated learning path: Java, C Sharp, TypeScript, Web">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#151b35"/>
      <stop offset="100%" stop-color="#0d1729"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#bg)" stroke="#334155"/>
  <g opacity=".18" stroke="#64748b">
    <path d="M0 65H1200M0 130H1200M0 195H1200"/>
    <path d="M120 0V260M360 0V260M600 0V260M840 0V260M1080 0V260"/>
  </g>

  <text x="56" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3">LEARNING PATH</text>
  <text x="56" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">School projects · practical progress</text>

  <path d="M115 178 C245 88, 355 224, 485 155 S735 74, 840 157 S1030 198, 1100 104" fill="none" stroke="#334155" stroke-width="5"/>
  <path d="M115 178 C245 88, 355 224, 485 155 S735 74, 840 157 S1030 198, 1100 104" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(185 126)">
      <circle r="14" fill="#60a5fa" filter="url(#glow)"><animate attributeName="r" values="12;17;12" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle r="6" fill="#eff6ff"/>
      <text x="-23" y="40" fill="#dbeafe" font-size="16" font-weight="700">Java</text>
    </g>
    <g transform="translate(485 155)">
      <circle r="14" fill="#a78bfa" filter="url(#glow)"><animate attributeName="r" values="12;17;12" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle r="6" fill="#f5f3ff"/>
      <text x="-18" y="40" fill="#ede9fe" font-size="16" font-weight="700">C#</text>
    </g>
    <g transform="translate(765 118)">
      <circle r="14" fill="#facc15" filter="url(#glow)"><animate attributeName="r" values="12;17;12" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle r="6" fill="#fefce8"/>
      <text x="-45" y="40" fill="#fef9c3" font-size="16" font-weight="700">TypeScript</text>
    </g>
    <g transform="translate(1030 188)">
      <circle r="14" fill="#34d399" filter="url(#glow)"><animate attributeName="r" values="12;17;12" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle r="6" fill="#ecfdf5"/>
      <text x="-43" y="40" fill="#d1fae5" font-size="16" font-weight="700">Web</text>
    </g>
  </g>

  <circle cx="115" cy="178" r="4" fill="#64748b"/>
  <circle cx="1100" cy="104" r="4" fill="#64748b"/>
</svg>
